name: Portal checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: Portal checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        env:
          FAMILYBOT_FAMILY_CONFIG: /tmp/familybot-test-config.json
        run: |
          printf '%s\n' '{"members":[],"portal":{"allowed_origins":["http://familie.local:3000","http://localhost:3000"]}}' > "$FAMILYBOT_FAMILY_CONFIG"
          npm run docs:check
          npm run lint
          npm test
